name: Port layout native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ports:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: windows-amd64, os: windows-2022, python_arch: x64, native_qpa: windows}
          - {id: windows-arm64, os: windows-11-arm, python_arch: arm64, native_qpa: windows}
          - {id: macos-amd64, os: macos-15-intel, python_arch: x64, native_qpa: cocoa}
          - {id: macos-arm64, os: macos-15, python_arch: arm64, native_qpa: cocoa}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare native PostgreSQL binary cache
        if: matrix.id == 'windows-arm64'
        id: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = & git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@v4
        if: matrix.id == 'windows-arm64'
        id: native-libpq-cache
        with:
          path: .vcpkg-cache
          key: windows-arm64-libpq-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('scripts/build-libpq-windows.ps1') }}
      - name: Build native PostgreSQL client on Windows ARM64
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: ./scripts/build-libpq-windows.ps1
      - name: Retain successful native client build
        if: matrix.id == 'windows-arm64' && steps.native-libpq-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: windows-arm64-libpq-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('scripts/build-libpq-windows.ps1') }}
      - name: Install focused test dependencies
        timeout-minutes: 8
        run: python -m pip install -e ".[dev]"
      - name: Qualify offscreen and native QPA text geometry
        timeout-minutes: 10
        shell: python
        env:
          NATIVE_QPA: ${{ matrix.native_qpa }}
        run: |
          import json, os, platform, subprocess, sys
          from pathlib import Path
          target = Path('artifacts/port-qualification')
          target.mkdir(parents=True, exist_ok=True)
          results = []
          for qpa, scale in [('offscreen', '1'), (os.environ['NATIVE_QPA'], '1.25')]:
              label = qpa + '-' + scale
              env = dict(os.environ, QT_QPA_PLATFORM=qpa, QT_SCALE_FACTOR=scale)
              cmd = [sys.executable, '-m', 'pytest', '-vv', '-s', '-W', 'error',
                     '-o', 'faulthandler_timeout=45', '--junitxml=' + str(target / (label + '.xml')),
                     'tests/test_connection_port_layout.py', 'tests/test_dialogs.py',
                     'tests/test_connection_extra_drivers.py', 'tests/test_connection_mongodb.py']
              print('BEGIN', label, platform.platform(), platform.machine(), flush=True)
              log = target / (label + '.log')
              with log.open('w', encoding='utf-8') as output:
                  try:
                      process = subprocess.run(cmd, env=env, stdout=output, stderr=subprocess.STDOUT, timeout=240)
                      result = dict(qpa=qpa, scale=scale, exit_code=process.returncode)
                  except subprocess.TimeoutExpired:
                      result = dict(qpa=qpa, scale=scale, timed_out=True, exit_code=124)
              data = log.read_text(encoding='utf-8', errors='replace')
              geometry = []
              for line in data.splitlines():
                  if 'PORT_GEOMETRY ' in line:
                      try:
                          geometry.append(json.loads(line.split('PORT_GEOMETRY ', 1)[1]))
                      except json.JSONDecodeError:
                          pass
              (target / (label + '-geometry.json')).write_text(json.dumps(geometry, indent=2), encoding='utf-8')
              result['geometry_observations'] = len(geometry)
              results.append(result)
              print('END', json.dumps(result), flush=True)
              print('\n'.join(data.splitlines()[-100:] if result['exit_code'] else data.splitlines()[-4:]), flush=True)
          (target / 'summary.json').write_text(json.dumps(dict(platform=platform.platform(), machine=platform.machine(), results=results), indent=2), encoding='utf-8')
          sys.exit(any(result['exit_code'] for result in results))
      - name: Upload native geometry and exact failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-qualification-${{ matrix.id }}
          path: artifacts/port-qualification
          if-no-files-found: error
