name: Native Mongo combo qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: linux-amd64, os: ubuntu-24.04, python_arch: x64, arch: amd64}
          - {id: linux-arm64, os: ubuntu-24.04-arm, python_arch: arm64, arch: arm64}
          - {id: windows-amd64, os: windows-2022, python_arch: x64, arch: amd64}
          - {id: windows-arm64, os: windows-11-arm, python_arch: arm64, arch: arm64}
          - {id: macos-amd64, os: macos-15-intel, python_arch: x64, arch: amd64}
          - {id: macos-arm64, os: macos-15, python_arch: arm64, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTEST_ADDOPTS: ''
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 libglib2.0-0t64 fonts-noto-cjk xvfb xauth
      - name: Prepare native PostgreSQL binary cache
        if: matrix.id == 'windows-arm64'
        id: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = & git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@v4
        if: matrix.id == 'windows-arm64'
        id: native-libpq-cache
        with:
          path: .vcpkg-cache
          key: windows-arm64-libpq-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('scripts/build-libpq-windows.ps1') }}
      - name: Build native PostgreSQL client on Windows ARM64
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: ./scripts/build-libpq-windows.ps1
      - name: Retain successful native client build
        if: matrix.id == 'windows-arm64' && steps.native-libpq-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: windows-arm64-libpq-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('scripts/build-libpq-windows.ps1') }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Qualify offscreen font and connection settings
        timeout-minutes: 8
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          BACKEND_LABEL: offscreen
        run: |
          python - <<'PYTEST'
          import json, os, platform
          from pathlib import Path
          import opennavicat, pytest
          from PySide6.QtCore import qVersion
          from PySide6.QtWidgets import QApplication, QStyleFactory
          application = QApplication([])
          target = Path('artifacts/combo-native') / os.environ['BACKEND_LABEL']
          target.mkdir(parents=True, exist_ok=True)
          runtime = {'source': os.environ['GITHUB_SHA'], 'machine': platform.machine(),
              'platform': application.platformName(), 'qt': qVersion(),
              'styles': QStyleFactory.keys(), 'scale': os.getenv('QT_SCALE_FACTOR', '1')}
          (target / 'runtime.json').write_text(json.dumps(runtime, indent=2))
          raise SystemExit(pytest.main(['-q', '-W', 'error', '-o', 'addopts=',
              '-o', 'junit_logging=all', '--junitxml=' + str(target / 'results.xml'),
              'tests/test_mongo_index_designer_ui.py', 'tests/test_connection_mongodb.py',
              'tests/test_connection_extra_drivers.py', 'tests/test_dialogs.py',
              '-k', 'not (real_serial or real_rebuild or real_delete)']))
          PYTEST
      - name: Qualify actual desktop backend at fractional scale
        timeout-minutes: 8
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'cocoa' || 'xcb' }}
          QT_SCALE_FACTOR: '1.25'
          BACKEND_LABEL: native
        run: |
          cat > "$RUNNER_TEMP/combo-native.py" <<'PYTEST'
          import json, os, platform
          from pathlib import Path
          import opennavicat, pytest
          from PySide6.QtCore import qVersion
          from PySide6.QtWidgets import QApplication, QStyleFactory
          application = QApplication([])
          target = Path('artifacts/combo-native') / os.environ['BACKEND_LABEL']
          target.mkdir(parents=True, exist_ok=True)
          runtime = {'source': os.environ['GITHUB_SHA'], 'machine': platform.machine(),
              'platform': application.platformName(), 'qt': qVersion(),
              'styles': QStyleFactory.keys(), 'scale': os.getenv('QT_SCALE_FACTOR', '1')}
          (target / 'runtime.json').write_text(json.dumps(runtime, indent=2))
          raise SystemExit(pytest.main(['-q', '-W', 'error', '-o', 'addopts=',
              '-o', 'junit_logging=all', '--junitxml=' + str(target / 'results.xml'),
              'tests/test_mongo_index_designer_ui.py',
              '-k', 'async_collection or relayout_after_live or own_live_font']))
          PYTEST
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a python "$RUNNER_TEMP/combo-native.py"
          else
            python "$RUNNER_TEMP/combo-native.py"
          fi
      - name: Check exact host style matrix and zero skips
        shell: bash
        run: |
          python - <<'CHECK'
          import itertools, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for backend in ('offscreen', 'native'):
              folder = Path('artifacts/combo-native') / backend
              runtime = json.loads((folder / 'runtime.json').read_text())
              cases = list(ET.parse(folder / 'results.xml').getroot().iter('testcase'))
              assert cases and not any(c.find(tag) is not None for c in cases for tag in ('failure', 'error', 'skipped'))
              names = {c.attrib['name'] for c in cases}
              matrix = {'test_async_collection_and_index_version_fit_actual_native_edit_field[' + theme + '-' + str(size) + '-' + style + ']'
                  for theme, size, style in itertools.product(('native', 'dark', 'light'), (12, 24, 36), runtime['styles'])}
              actual = {n for n in names if n.startswith('test_async_collection_and_index_version_fit_actual_native_edit_field[')}
              assert actual == matrix, (sorted(matrix - actual), sorted(actual - matrix))
              assert {'test_collection_and_version_relayout_after_live_font_style_and_metadata_changes',
                  'test_combo_uses_own_live_font_metrics_and_bounds_long_catalog_names'} <= names
              print(json.dumps({'backend': backend, 'runtime': runtime, 'passed': len(cases),
                  'font_matrix': len(matrix), 'live_geometry': 2, 'skipped': 0}, sort_keys=True), flush=True)
          CHECK
      - name: Upload exact source runtime and text geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo-qualification-${{ matrix.id }}
          path: artifacts/combo-native/
          if-no-files-found: warn
