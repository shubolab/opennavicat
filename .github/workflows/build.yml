name: Native installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: linux-amd64, os: ubuntu-24.04, python_arch: x64, arch: amd64}
          - {id: linux-arm64, os: ubuntu-24.04-arm, python_arch: arm64, arch: arm64}
          - {id: windows-amd64, os: windows-2022, python_arch: x64, arch: amd64}
          - {id: windows-arm64, os: windows-11-arm, python_arch: arm64, arch: arm64}
          - {id: macos-amd64, os: macos-15-intel, python_arch: x64, arch: amd64}
          - {id: macos-arm64, os: macos-15, python_arch: arm64, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxkbcommon-x11-0 libglib2.0-0t64 fonts-noto-cjk xvfb xauth
      - name: Prepare native PostgreSQL binary cache
        if: matrix.id == 'windows-arm64'
        id: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $revision = & git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/cache@v4
        if: matrix.id == 'windows-arm64'
        id: native-libpq-cache
        with:
          path: .vcpkg-cache
          key: windows-arm64-libpq-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('scripts/build-libpq-windows.ps1') }}
      - name: Build native PostgreSQL client on Windows ARM64
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: ./scripts/build-libpq-windows.ps1
      - name: Retain successful native client build
        if: matrix.id == 'windows-arm64' && steps.native-libpq-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: windows-arm64-libpq-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('scripts/build-libpq-windows.ps1') }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify application
        run: python -c "import opennavicat, pytest, sys; sys.exit(pytest.main(['-q', '-W', 'error', '--junitxml=artifacts/pytest-results.xml']))"
      - name: Build native desktop distribution
        run: python scripts/build.py --clean
      - name: Record bundled OpenSSL provider dependencies
        run: python scripts/check-openssl-providers.py --bundle "${{ runner.os == 'macOS' && 'dist/OpenNavicat.app' || 'dist/OpenNavicat' }}" --output artifacts/openssl-providers-bundle.json
      - name: Run packaged application and all driver imports
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'cocoa' }}
        run: python scripts/smoke-built.py
      - name: Run packaged application on X11
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python scripts/smoke-built.py
      - name: Package and verify native installer
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'cocoa' }}
        run: python scripts/package-installer.py --output-dir release-assets --arch ${{ matrix.arch }} --verify-installed
      - name: Package and verify native installer on X11
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a python scripts/package-installer.py --output-dir release-assets --arch ${{ matrix.arch }} --verify-installed
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.id }}
          path: |
            artifacts/pytest-results.xml
            artifacts/packaged-smoke.json
            artifacts/packaged-workbench.png
            artifacts/openssl-providers*.json
            release-assets/*manifest*.json
          if-no-files-found: ignore

  database-security:
    name: Real database TLS and SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libglib2.0-0t64
      - run: python -m pip install -e ".[dev]"
      - name: Verify real TLS and SSH connections
        env:
          QT_QPA_PLATFORM: offscreen
          OPENNAVICAT_SECURITY_TESTS: '1'
        run: python -m pytest -q tests/test_connection_security_integration.py --junitxml=artifacts/security-integration/pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-database-security
          path: artifacts/security-integration/
          if-no-files-found: ignore

  release:
    name: Publish complete six-target release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, database-security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py --tag "$GITHUB_REF_NAME" --assets release-assets
