name: Native installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: linux-amd64, os: ubuntu-24.04, python_arch: x64, arch: amd64}
          - {id: linux-arm64, os: ubuntu-24.04-arm, python_arch: arm64, arch: arm64}
          - {id: windows-amd64, os: windows-2022, python_arch: x64, arch: amd64}
          - {id: windows-arm64, os: windows-11-arm, python_arch: arm64, arch: arm64}
          - {id: macos-amd64, os: macos-15-intel, python_arch: x64, arch: amd64}
          - {id: macos-arm64, os: macos-15, python_arch: arm64, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libglib2.0-0t64 fonts-noto-cjk
      - name: Build native PostgreSQL client on Windows ARM64
        if: matrix.id == 'windows-arm64'
        shell: pwsh
        run: ./scripts/build-libpq-windows.ps1
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify application
        run: python -m pytest -q --junitxml=artifacts/pytest-results.xml
      - name: Build native desktop distribution
        run: python scripts/build.py --clean
      - name: Run packaged application and all driver imports
        run: python scripts/smoke-built.py
      - name: Package and verify native installer
        run: python scripts/package-installer.py --output-dir release-assets --arch ${{ matrix.arch }} --verify-installed
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.id }}
          path: |
            artifacts/pytest-results.xml
            artifacts/packaged-smoke.json
            artifacts/packaged-workbench.png
            release-assets/*manifest*.json
          if-no-files-found: ignore

  database-security:
    name: Real database TLS and SSH
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libglib2.0-0t64
      - run: python -m pip install -e ".[dev]"
      - name: Verify real TLS and SSH connections
        env:
          QT_QPA_PLATFORM: offscreen
          OPENNAVICAT_SECURITY_TESTS: '1'
        run: python -m pytest -q tests/test_connection_security_integration.py --junitxml=artifacts/security-integration/pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-database-security
          path: artifacts/security-integration/
          if-no-files-found: ignore

  release:
    name: Publish complete six-target release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, database-security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete installer set and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-release.py --tag "$GITHUB_REF_NAME" --assets release-assets
