name: Oracle native integration

on:
  push:
    branches: [codex_oracle_ci_native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-native:
    name: Oracle native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: ubuntu-24.04}
          - {arch: arm64, os: ubuntu-24.04-arm}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install database-security Linux dependencies
        run: python scripts/install-linux-dependencies.py --profile database-security
      - run: python -m pip install -e ".[dev]"
      - name: Verify dedicated Oracle adapter on a fresh native pinned server
        run: python scripts/test-oracle.py --pull-image --output artifacts/oracle-native
      - name: Verify exact Oracle fixture cleanup without starting or connecting
        if: always()
        run: python scripts/test-oracle.py --cleanup-interrupted --output artifacts/oracle-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-oracle-native-${{ matrix.arch }}
          path: artifacts/oracle-native/
          if-no-files-found: error
